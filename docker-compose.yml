version: '3.9'

services:

  # ── Application ────────────────────────────────────────
  app:
    build:
      context: .
      target: production
    image: library-system:latest
    container_name: library-app
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://library:library@postgres:5432/librarydb
      - SECRET_KEY=${SECRET_KEY:-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - library-net
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=5000"
      - "prometheus.path=/metrics"

  # ── PostgreSQL ─────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: library-postgres
    environment:
      POSTGRES_DB: librarydb
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d librarydb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - library-net

  # ── Prometheus ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: library-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - library-net
    restart: unless-stopped

  # ── Grafana ────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.0
    container_name: library-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - library-net
    restart: unless-stopped

  # ── Nginx reverse proxy ────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: library-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - library-net
    restart: unless-stopped

networks:
  library-net:
    driver: bridge

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
